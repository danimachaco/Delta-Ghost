spring.application.name=ruta-fantasma
server.port=8080

# Conexión con MySQL. Si no se definen las variables, usa estos valores de desarrollo.
# Nunca subas la contraseña real al repositorio: defínela con la variable MYSQL_PASSWORD.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/ruta_fantasma?createDatabaseIfNotExist=true&serverTimezone=Europe/Madrid}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# Hibernate crea o actualiza las tablas a partir de las entidades al arrancar.
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las sentencias SQL (útil para aprender y depurar)
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Token JWT de la sesión. En producción define JWT_SECRETO con una clave larga y secreta
# (mínimo 32 caracteres). El valor por defecto es SOLO para desarrollo.
jwt.secreto=${JWT_SECRETO:clave-de-desarrollo-ruta-fantasma-cambiar-en-produccion}
jwt.horas-validez=24
