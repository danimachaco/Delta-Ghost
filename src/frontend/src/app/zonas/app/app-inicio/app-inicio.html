<header class="barra">
  <h1>Mis rutas</h1>
  <!-- Sesión: saludo + salir si has entrado; enlace para entrar si no -->
  @if (auth.usuario(); as usuario) {
    <div class="sesion">
      <span class="suave">Hola, {{ usuario.nombre }}</span>
      <button type="button" class="enlace" (click)="auth.cerrarSesion()">Salir</button>
    </div>
  } @else {
    <a class="enlace" routerLink="/app/login">Entrar</a>
  }
</header>

<main class="contenido">
  <!-- Cuando exista la API, aquí se listarán las rutas guardadas -->
  <div class="vacio">
    <p>Todavía no tienes rutas guardadas.</p>
    <p class="suave">Sal a correr con el reloj y tu primera ruta aparecerá aquí.</p>
  </div>
</main>

<nav class="menu-inferior">
  <a routerLink="/app">Rutas</a>
  <a routerLink="/reloj">Reloj</a>
  <a routerLink="/web">Web</a>
</nav>
