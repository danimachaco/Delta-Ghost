<div class="esfera" [class.mejor]="vasMejor()" [class.peor]="!vasMejor()">
  <div class="datos">
    <span class="tiempo">{{ tiempo() }}</span>
    <span class="diferencia">{{ textoDiferencia() }}</span>

    <!-- Barra de progreso: cada punto está en su posición dentro de la ruta -->
    <div class="barra" role="img" [attr.aria-label]="descripcionBarra()">
      <div class="pista">
        <span class="punto punto-sombra" [style.left.%]="posicionSombra()"></span>
        <span class="punto punto-tu" [style.left.%]="posicionTu()"></span>
      </div>
    </div>
  </div>
</div>

<!-- La leyenda usa la misma forma que los puntos, así no depende solo del color -->
<p class="leyenda">
  <span class="tu"><i class="marca marca-tu" aria-hidden="true"></i> Tú</span>
  <span class="sombra"><i class="marca marca-sombra" aria-hidden="true"></i> Sombra</span>
</p>

<a class="salir" routerLink="/app">← Salir</a>
