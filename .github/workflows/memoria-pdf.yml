# Genera docs/memoria.pdf automáticamente cada vez que alguien sube
# cambios de la memoria a la rama principal. No hay que hacer nada a mano.
name: Generar memoria PDF

on:
  push:
    branches: [main, master]
    paths:
      - "docs/memoria/**"
      - "scripts/generar-memoria.sh"
      - ".github/workflows/memoria-pdf.yml"
  workflow_dispatch: # botón "Run workflow" para generarla cuando queráis

permissions:
  contents: write

concurrency:
  group: memoria-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Pandoc y LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-spanish lmodern fonts-dejavu

      - name: Generar el PDF
        run: |
          if ! bash scripts/generar-memoria.sh > salida.log 2>&1; then
            cat salida.log
            # Muestra el error como aviso en la ejecución para verlo fácil
            grep -E '^!|Error|not found' salida.log | head -5 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cat salida.log

      - name: Guardar el PDF como descarga de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: memoria-pdf
          path: docs/memoria.pdf

      - name: Subir el PDF al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/memoria.pdf
          if git diff --cached --quiet; then
            echo "El PDF no ha cambiado."
            exit 0
          fi
          git commit -m "docs: actualizar memoria.pdf [skip ci]"
          git pull --rebase
          git push
